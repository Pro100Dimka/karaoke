[project]
name = "a-and-d-voice-backend"
version = "0.3.7"
description = "Локальный FastAPI backend приложения A&D Voice."
requires-python = ">=3.11,<3.13"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "engines",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort (сортировка импортов)
    "UP",  # pyupgrade (актуальный синтаксис под target-version)
    "B",   # flake8-bugbear (частые логические ошибки)
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # FastAPI declares Depends/File through parameter defaults.
    "E501", # длину строк уже ограничивает line-length; докстринги/комментарии на русском иногда длиннее
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["AI/"]

[[tool.mypy.overrides]]
module = ["AI", "AI.*"]
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
