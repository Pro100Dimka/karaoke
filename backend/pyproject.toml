[project]
name = "karaoke-ai-backend"
version = "0.2.4"
description = "Локальный FastAPI backend поверх AI-пайплайна (Karaoke AI)."
requires-python = ">=3.11,<3.13"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "AI/tests",
    "app/data",
    "dist",
    "engines",
    "full_songs",
    "Song",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort (сортировка импортов)
    "UP",  # pyupgrade (актуальный синтаксис под target-version)
    "B",   # flake8-bugbear (частые логические ошибки)
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # FastAPI declares Depends/File through parameter defaults.
    "E501", # длину строк уже ограничивает line-length; докстринги/комментарии на русском иногда длиннее
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["AI/", "Song/", "full_songs/"]

[tool.pytest.ini_options]
testpaths = ["tests", "AI/tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["AI/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 55
