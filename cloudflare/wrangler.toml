name = "karaoke-studio-online"
main = "src/worker.js"
compatibility_date = "2026-08-03"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "KaraokeRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KaraokeRoom"]

# Collects client error logs (backend, frontend and Electron main process --
# see backend/app/services/remote_log_service.py and POST /diagnostics/client-log)
# in one accumulating JSON file per device id. Create the bucket once before deploying:
#   wrangler r2 bucket create karaoke-studio-logs
[[r2_buckets]]
binding = "LOGS"
bucket_name = "karaoke-studio-logs"
